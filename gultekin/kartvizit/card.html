<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gültekin Öksüz - Basılabilir Kartvizit</title>
<style>
/* Baskı boyutu: 55 x 85 mm (dikey). Tarayıcıdan PDF olarak yazdırılabilir. */
@page{size:55mm 85mm;margin:0}
:root{--gold:#e5b943;--gold2:#f4d06a;--navy:#06152b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0f17}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Plus Jakarta Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff}
.card{position:relative;width:550px;height:850px;border-radius:34px;overflow:hidden;text-align:center;
 background:linear-gradient(180deg,rgba(2,10,24,.10),rgba(2,10,24,.35)),url('bg.webp') center/cover,var(--navy);
 box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 0 0 1.5px rgba(229,185,67,.35)}
.logo{position:absolute;top:22px;right:20px;width:150px;height:150px;object-fit:cover;border-radius:18px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.avatar{position:absolute;top:34px;left:34px;width:136px;height:136px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 6px rgba(229,185,67,.14),0 0 30px rgba(229,185,67,.35)}
.name{position:absolute;top:196px;left:0;right:0;font-size:38px;font-weight:800;letter-spacing:-.8px;text-transform:uppercase;color:var(--gold2);text-shadow:0 3px 14px rgba(0,0,0,.6)}
.title{position:absolute;top:248px;left:0;right:0;font-size:21px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff}
.subtitle{position:absolute;top:288px;left:0;right:0;font-size:16.5px;color:#dbe6f5}
.cta{position:absolute;top:336px;left:40px;right:40px;height:62px;border-radius:12px;display:flex;align-items:center;justify-content:center;
 font-size:21px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#071322;
 background:linear-gradient(135deg,#f8dd85,#d9a92c 55%,#f0cb62);border:1px solid #f8dc7c;box-shadow:0 8px 24px rgba(243,156,18,.3)}
.qr-wrap{position:absolute;top:422px;left:50%;transform:translateX(-50%);width:222px;height:222px;padding:15px;background:#fff;border-radius:20px;
 border:3px solid var(--gold);box-shadow:0 0 0 7px rgba(229,185,67,.12),0 12px 34px rgba(0,0,0,.5)}
.qr-wrap img{width:100%;height:100%;display:block}
.hint{position:absolute;top:660px;left:0;right:0;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold2)}
.icons{position:absolute;top:696px;left:30px;right:30px;display:grid;grid-template-columns:repeat(4,1fr);padding-top:12px;border-top:1px solid rgba(229,185,67,.25)}
.icons div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700}
.icons svg{width:30px;height:30px;fill:var(--gold2)}
.info{position:absolute;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:26px;font-size:15.5px;font-weight:700}
.info span{display:flex;align-items:center;gap:8px}
.info svg{width:18px;height:18px;fill:var(--gold2)}
@media print{html,body{background:none}body{display:block;min-height:0}.card{width:55mm;height:85mm;border-radius:0;box-shadow:none;zoom:.3866}}
</style>
</head>
