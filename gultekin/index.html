<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Gültekin Öksüz - CFO | TheListing.io</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#e5b943;--gold2:#f4d06a;--navy:#06152b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:'Plus Jakarta Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#fff;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:28px 0;overflow-x:hidden;
 background:
  radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.10),transparent 55%),
  radial-gradient(ellipse at 50% 110%,rgba(0,0,0,.7),transparent 60%),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.35'/></svg>"),
  #15181f}
.scene{width:100%;max-width:420px;padding:0 20px;perspective:1100px}
.stack{position:relative;transform-style:preserve-3d;transition:transform .25s ease-out;will-change:transform}
.stack.idle{animation:float 7s ease-in-out infinite}
@keyframes float{0%,100%{transform:rotateX(3deg) rotateY(-5deg)}50%{transform:rotateX(-2deg) rotateY(5deg)}}
@media(prefers-reduced-motion:reduce){.stack.idle{animation:none}}
/* arkadaki kart destesi */
.layer{position:absolute;inset:0;border-radius:30px;background:linear-gradient(180deg,#1b2a47,#0a1630);border:1px solid rgba(229,185,67,.25);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.layer.l1{transform:translate3d(14px,-2px,-40px) rotate(2.4deg)}
.layer.l2{transform:translate3d(26px,4px,-80px) rotate(4.6deg);opacity:.8}
.card{position:relative;border-radius:30px;overflow:hidden;text-align:center;padding:22px 20px 22px;
 background:linear-gradient(180deg,rgba(2,10,24,.08),rgba(2,10,24,.38)),url('kartvizit/bg.webp') center/cover,var(--navy);
 box-shadow:0 30px 60px rgba(0,0,0,.65),0 0 0 1.5px rgba(229,185,67,.45),inset 0 0 0 1px rgba(255,255,255,.06);transform:translateZ(0)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
 background:linear-gradient(115deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.14) 48%,rgba(255,255,255,0) 60%);background-size:250% 100%;background-position:var(--sheen,120%) 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:4px solid var(--gold);box-shadow:0 0 0 5px rgba(229,185,67,.14),0 0 28px rgba(229,185,67,.4),0 10px 20px rgba(0,0,0,.5)}
.logo{width:138px;height:138px;margin:-6px -6px 0 0;object-fit:cover;border-radius:50%;
 -webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%);mask-image:radial-gradient(circle,#000 58%,transparent 72%);filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
.name{font-size:29px;font-weight:800;letter-spacing:-.6px;text-transform:uppercase;line-height:1.1;
 background:linear-gradient(180deg,#fff2b8 0%,#f4d06a 38%,#c99a22 62%,#f4d06a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 1px 0 #7a5a10) drop-shadow(0 3px 0 #4d3708) drop-shadow(0 8px 10px rgba(0,0,0,.6))}
.title{margin-top:8px;font-size:17px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.subtitle{margin-top:6px;font-size:13px;color:#dbe6f5;text-shadow:0 1px 6px rgba(0,0,0,.7)}
/* fırçalanmış altın buton */
.cta{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;margin:20px 0 18px;border:1px solid #f9e08c;border-radius:10px;cursor:pointer;
 font:800 17px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:1.3px;text-transform:uppercase;color:#1d1405;text-shadow:0 1px 0 rgba(255,255,255,.45);
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.05) 1px 3px),linear-gradient(180deg,#fbe79a 0%,#e4b83f 45%,#b98a1c 55%,#e9c352 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(120,80,5,.55),0 6px 0 #6e4f0c,0 12px 22px rgba(0,0,0,.55);transition:transform .08s,box-shadow .08s}
.cta:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(120,80,5,.55),0 2px 0 #6e4f0c,0 5px 10px rgba(0,0,0,.5)}
.cta svg{width:20px;height:20px;fill:#1d1405}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:14px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 2px;border-radius:12px;color:#fff;text-decoration:none;font-size:12px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.act:active{background:rgba(229,185,67,.12)}
.act svg{width:32px;height:32px;fill:var(--gold2);filter:drop-shadow(0 2px 0 #7a5a10) drop-shadow(0 5px 6px rgba(0,0,0,.6))}
.info{display:flex;flex-direction:column;gap:9px;align-items:center}
.info a{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:15px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.info svg{width:20px;height:20px;fill:var(--gold2);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.share{margin:14px auto 0;display:block;background:none;border:0;color:rgba(244,208,106,.85);font:700 12px 'Plus Jakarta Sans',sans-serif;letter-spacing:.8px;cursor:pointer;text-transform:uppercase;padding:6px 10px}
</style>
</head>
<body>
<div class="scene">
 <div class="stack idle" id="stack">
  <div class="layer l2"></div><div class="layer l1"></div>
  <main class="card" id="card">
   <div class="top">
    <img class="avatar" src="kartvizit/avatar.jpg" alt="Gültekin Öksüz">
    <img class="logo" src="kartvizit/logo.png" alt="The Listing">
   </div>
   <h1 class="name">Gültekin Öksüz</h1>
   <div class="title">CFO • TheListing.io</div>
   <p class="subtitle">Exchange Relations &amp; Listings for Web3 Projects</p>

   <a class="cta" id="addBtn" href="Gultekin_Oksuz.vcf" type="text/vcard"><svg viewBox="0 0 24 24"><path d="M15 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-9 0v-2H4V8h2V6h2v2h2v2H8v2zm9 2c-2.7 0-8 1.3-8 4v2h16v-2c0-2.700-5.300-4-8-4z"/></svg>Kişilere Ekle</a>

   <div class="actions">
    <a class="act" href="tel:+905458416977"><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>Ara</a>
    <a class="act" href="https://wa.me/905458416977" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.8 14.1c-.25.7-1.4 1.3-1.95 1.35-.5.05-1.1.07-1.8-.12a14 14 0 0 1-4.9-3c-1.6-1.5-2.7-3.4-2.8-3.6s-.7-1.6-.7-2.2c.02-1 .6-1.5.8-1.7.2-.2.45-.25.6-.25h.45c.15 0 .35-.05.55.4l.75 1.8c.05.15.1.3 0 .5-.1.2-.15.3-.3.45l-.4.5c-.15.15-.3.3-.1.6.15.3.7 1.2 1.55 1.9 1.05.95 1.95 1.25 2.25 1.4.3.15.45.1.6-.1l.85-1c.2-.25.4-.2.65-.1l1.7.8c.25.1.4.2.5.3.05.15.05.7-.2 1.4z"/></svg>WhatsApp</a>
    <a class="act" href="https://t.me/tekinn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M21.9 3.4 2.6 10.9c-.9.35-.9 1 0 1.3l4.9 1.5 1.9 5.8c.2.6.45.75.9.4l2.7-2.2 4.9 3.6c.9.5 1.55.25 1.8-.85L23 4.5c.3-1.3-.5-1.9-1.1-1.1zM9 13.6l9.4-6c.45-.25.85-.1.5.2l-7.8 7-.3 3.2z"/></svg>Telegram</a>
    <a class="act" href="https://www.linkedin.com/in/gultekinoksuz" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M20.4 2H3.6A1.6 1.6 0 0 0 2 3.6v16.8A1.6 1.6 0 0 0 3.6 22h16.8a1.6 1.6 0 0 0 1.6-1.6V3.6A1.6 1.6 0 0 0 20.4 2zM8 18.5H5.3V9.9H8zM6.65 8.7a1.55 1.55 0 1 1 0-3.1 1.55 1.55 0 0 1 0 3.1zM18.5 18.5h-2.7v-4.2c0-1 0-2.3-1.4-2.3s-1.6 1.1-1.6 2.2v4.3H10V9.9h2.6v1.2a2.8 2.8 0 0 1 2.5-1.4c2.7 0 3.2 1.8 3.2 4.1z"/></svg>LinkedIn</a>
   </div>

   <div class="info">
    <a href="mailto:info@thelisting.io"><svg viewBox="0 0 24 24"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h17A1.5 1.5 0 0 1 22 5.5v.4l-10 6.3L2 5.9zM2 8.2v10.3A1.5 1.5 0 0 0 3.5 20h17a1.5 1.5 0 0 0 1.5-1.5V8.2l-9.4 5.9a1.2 1.2 0 0 1-1.2 0z"/></svg>info@thelisting.io</a>
    <a href="https://thelisting.io/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 9h-3a15.6 15.6 0 0 0-1.3-6A8 8 0 0 1 18.9 11zM12 4c.8 1 1.6 3.1 1.9 7h-3.8C10.4 7.1 11.2 5 12 4zM4 13h3a15.6 15.6 0 0 0 1.3 6A8 8 0 0 1 5.1 13zm3-2H5.1A8 8 0 0 1 9.4 5 15.6 15.6 0 0 0 8 11zm5 9c-.8-1-1.6-3.1-1.9-7h3.8c-.3 3.9-1.1 6-1.9 7zm2.6-1a15.6 15.6 0 0 0 1.3-6h3A8 8 0 0 1 14.6 19z"/></svg>thelisting.io</a>

   <button class="share" onclick="shareCard()">Kartviziti Paylaş</button>
  </main>
 </div>
</div>
<script>
/* Android: paylaşım menüsüyle Kişiler uygulamasını doğrudan aç; olmazsa/iPhone'da vcf bağlantısı çalışır */
document.getElementById('addBtn').addEventListener('click',async e=>{
 if(!/Android/i.test(navigator.userAgent)||!navigator.canShare)return;
 e.preventDefault();
 try{const r=await fetch('Gultekin_Oksuz.vcf'),b=await r.blob(),f=new File([b],'Gultekin_Oksuz.vcf',{type:'text/vcard'});
  if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(err){if(err&&err.name==='AbortError')return}
 location.href='Gultekin_Oksuz.vcf?'+Date.now()});
function shareCard(){if(navigator.share){navigator.share({title:'Gültekin Öksüz - TheListing.io',text:'Gültekin Öksüz | CFO - TheListing.io Dijital Kartvizit',url:location.href}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>alert('Sayfa bağlantısı panoya kopyalandı!'))}else{alert(location.href)}}
/* 3B eğim: parmak/fare ile kartı çevir, bırakınca yüzer hale dön */
(function(){const s=document.getElementById('stack'),c=document.getElementById('card');let t;
function tilt(x,y){const r=s.getBoundingClientRect(),px=(x-r.left)/r.width-.5,py=(y-r.top)/r.height-.5;s.classList.remove('idle');s.style.transform=`rotateX(${(-py*14).toFixed(1)}deg) rotateY(${(px*18).toFixed(1)}deg)`;c.style.setProperty('--sheen',(120-(px+.5)*150)+'%');clearTimeout(t);t=setTimeout(()=>{s.style.transform='';s.classList.add('idle')},1600)}
window.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch')tilt(e.clientX,e.clientY)},{passive:true})})();
</script>
</body>
