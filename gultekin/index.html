.vcard-container{width:100%;max-width:420px;min-height:100vh;padding:20px 16px 14px;background:rgba(3,15,31,.48);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);border-left:1px solid rgba(212,175,55,.12);border-right:1px solid rgba(212,175,55,.12);box-shadow:0 0 40px rgba(0,0,0,.3);text-align:center;position:relative;overflow:hidden}
.logo-box{margin:0 0 12px;text-align:left}
.logo-img{width:105px;height:105px;object-fit:cover;border-radius:12px;filter:drop-shadow(0 5px 12px rgba(0,0,0,.45))}
.avatar-box{width:96px;height:96px;margin:0 auto 10px}
.avatar-img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 4px rgba(229,185,67,.12),0 0 18px rgba(212,175,55,.3)}
.name{font-size:25px;font-weight:800;letter-spacing:-.7px;margin-bottom:2px}.title{font-size:15px;font-weight:700;color:var(--gold2);margin-bottom:5px}.subtitle{font-size:12px;color:#d8e1ec;margin-bottom:14px}
.primary-btn{width:100%;background:linear-gradient(135deg,#f4d06a,#dcae32);color:#071322;font-weight:700;font-size:15px;padding:12px;border-radius:13px;border:1px solid #f6d878;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 6px 18px rgba(243,156,18,.25);margin-bottom:10px}
.actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.action-btn{background:rgba(6,24,47,.82);border:1px solid rgba(91,121,159,.7);color:#fff;min-height:44px;padding:9px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}.action-btn i{font-size:15px}
.info-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}.info-item{background:rgba(6,24,47,.84);border:1px solid rgba(91,121,159,.62);padding:9px 12px;border-radius:12px;display:flex;align-items:center;gap:11px;text-decoration:none;color:#fff;text-align:left;min-height:62px}.info-icon{width:34px;height:34px;border-radius:50%;background:rgba(212,175,55,.08);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold2);flex-shrink:0}.info-text label{display:block;font-size:9px;color:#9eafc4}.info-text span{font-size:12px;font-weight:700}.share-btn{width:100%;min-height:42px;background:rgba(6,24,47,.76);border:1px solid var(--gold);color:var(--gold2);border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:9px}.footer-tag{font-size:8px;color:rgba(220,230,242,.68);letter-spacing:1.1px;text-transform:uppercase}
@media(max-height:720px){.vcard-container{padding-top:12px}.logo-img{width:82px;height:82px}.avatar-box{width:82px;height:82px}.name{font-size:22px}.subtitle{margin-bottom:9px}.primary-btn{min-height:42px;padding:9px}.action-btn{min-height:40px}.info-item{min-height:55px;padding:7px 10px}.footer-tag{font-size:7px}}
</style>
