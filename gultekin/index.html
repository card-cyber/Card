<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14161b">
<title>Gültekin Öksüz - CFO | TheListing.io</title>
<meta property="og:title" content="Gültekin Öksüz - CFO | TheListing.io">
<meta property="og:description" content="Exchange Relations &amp; Listings for Web3 Projects">
<meta property="og:image" content="https://card-cyber.github.io/Card/gultekin/kart-en.webp">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#14161b}
html,body{min-height:100%}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:-40px;background:var(--bg,url('kart-en.webp')) center/cover;filter:blur(28px) brightness(.55);z-index:-1}
.wrap{position:relative;width:min(100vw,calc(100dvh * 1024 / 1536),640px);aspect-ratio:1024/1536}
.wrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.wrap svg{position:absolute;inset:0;width:100%;height:100%}
.wrap a{outline:none}
.wrap polygon{fill:transparent;cursor:pointer;transition:fill .12s}
.wrap a:active polygon,.wrap a:focus-visible polygon{fill:rgba(255,255,255,.22)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:388px;margin:0 auto;padding:14px 16px;border-radius:14px;background:rgba(6,21,43,.96);border:1px solid #e5b943;color:#fff;font:600 13px/1.4 system-ui,sans-serif;text-align:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s;z-index:9}
#toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<main class="wrap">
 <img id="kart" width="1024" height="1536" alt="Gültekin Öksüz - CFO, TheListing.io">
 <svg id="zones" viewBox="0 0 1024 1536" role="group"></svg>
</main>
<script>
/* Dil: telefon/tarayıcı dili Türkçe ise Türkçe, diğer tüm durumlarda İngilizce */
const LANGS={"en": {"img": "kart-en.webp", "alt": "Gültekin Öksüz - CFO, TheListing.io", "toast": "File downloaded: tap \"Open\" in the notification, or tap the file in Downloads and save it to Contacts", "copied": "Page link copied!", "share": "Gültekin Öksüz | CFO - TheListing.io Digital Business Card", "labels": {"add": "Add to contacts", "call": "Call now", "wa": "WhatsApp", "tg": "Telegram", "in": "LinkedIn", "mail": "Send email", "web": "Website", "share": "Share card"}, "zones": {"add": "195,792 872,885 862,978 190,882", "call": "188,912 335,925 318,1075 165,1058", "wa": "355,938 512,950 495,1100 337,1085", "tg": "530,962 688,980 668,1138 518,1120", "in": "705,990 862,1005 843,1157 695,1135", "mail": "160,1080 487,1127 478,1215 145,1165", "web": "500,1135 838,1185 830,1277 498,1220", "share": "140,1188 828,1298 815,1405 122,1270"}}, "tr": {"img": "kart-tr.webp", "alt": "Gültekin Öksüz - CFO, TheListing.io", "toast": "Dosya indi: bildirimden \"Aç\"a veya İndirilenler'den dosyaya dokunup Kişiler'e kaydedin", "copied": "Sayfa bağlantısı panoya kopyalandı!", "share": "Gültekin Öksüz | CFO - TheListing.io Dijital Kartvizit", "labels": {"add": "Kişilerime ekle", "call": "Hemen ara", "wa": "WhatsApp", "tg": "Telegram", "in": "LinkedIn", "mail": "E-posta gönder", "web": "Web sitesi", "share": "Kartı paylaş"}, "zones": {"add": "165,853 893,910 888,1010 153,945", "call": "147,978 310,988 300,1140 132,1130", "wa": "330,990 503,1003 493,1155 320,1143", "tg": "525,1008 697,1022 690,1172 518,1160", "in": "717,1025 887,1038 885,1190 710,1175", "mail": "122,1155 497,1180 495,1275 120,1245", "web": "515,1187 883,1215 880,1308 513,1280", "share": "108,1268 880,1332 878,1440 105,1372"}}};
const LINKS={"add": ["Gultekin_Oksuz.vcf", {"id": "addBtn", "type": "text/vcard"}], "call": ["tel:+905458416977", {}], "wa": ["https://wa.me/905458416977", {"target": "_blank", "rel": "noopener"}], "tg": ["https://t.me/tekinn", {"target": "_blank", "rel": "noopener"}], "in": ["https://www.linkedin.com/in/gultekinoksuz", {"target": "_blank", "rel": "noopener"}], "mail": ["mailto:info@thelisting.io", {}], "web": ["https://thelisting.io/", {"target": "_blank", "rel": "noopener"}], "share": ["#", {"id": "shareBtn"}]};
const lang=((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase().startsWith('tr')?'tr':'en';
const L=LANGS[lang];document.documentElement.lang=lang;
const kart=document.getElementById('kart');kart.alt=L.alt;kart.src=L.img;
document.body.style.setProperty('--bg','url('+L.img+')');document.getElementById('zones').innerHTML=Object.entries(LINKS).map(([k,[h,at]])=>{const x=Object.entries(at).map(([n,v])=>n+'="'+v+'"').join(' ');return '<a href="'+h+'" aria-label="'+L.labels[k]+'" '+x+'><polygon points="'+L.zones[k]+'"/></a>'}).join('');
</script>
<div id="toast" role="status"></div>
<script>
/* Android: paylaşım menüsüyle Kişiler uygulamasını aç; olmazsa vcf indirilir ve yönerge gösterilir. iPhone'da vcf bağlantısı doğrudan Kişi Ekle açar */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),6000)}
document.getElementById('addBtn').addEventListener('click',async e=>{
 if(!/Android/i.test(navigator.userAgent))return;
 e.preventDefault();
 if(navigator.canShare){try{const r=await fetch('Gultekin_Oksuz.vcf'),b=await r.blob();
  for(const type of ['text/vcard','text/x-vcard','text/directory']){const f=new File([b],'Gultekin_Oksuz.vcf',{type});
   if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}}catch(err){if(err&&err.name==='AbortError')return}}
 location.href='Gultekin_Oksuz.vcf?'+Date.now();
 toast(L.toast);});
function shareCard(){if(navigator.share){navigator.share({title:'Gültekin Öksüz - TheListing.io',text:L.share,url:location.href}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>alert(L.copied))}else{alert(location.href)}}
document.getElementById('shareBtn').addEventListener('click',e=>{e.preventDefault();shareCard()});
</script>
</body>
</html>
