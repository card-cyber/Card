<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161b">
<title>Gültekin Öksüz - CFO | TheListing.io</title>
<meta property="og:title" content="Gültekin Öksüz - CFO | TheListing.io">
<meta property="og:description" content="Exchange Relations &amp; Listings for Web3 Projects">
<meta property="og:image" content="https://card-cyber.github.io/Card/gultekin/kart.webp">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#14161b}
html,body{min-height:100%}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:-40px;background:url('kart.webp') center/cover;filter:blur(28px) brightness(.55);z-index:-1}
.wrap{position:relative;width:min(100vw,calc(100dvh * 1024 / 1536),640px);aspect-ratio:1024/1536}
.wrap img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.wrap svg{position:absolute;inset:0;width:100%;height:100%}
.wrap a{outline:none}
.wrap polygon{fill:transparent;cursor:pointer;transition:fill .12s}
.wrap a:active polygon,.wrap a:focus-visible polygon{fill:rgba(255,255,255,.22)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:388px;margin:0 auto;padding:14px 16px;border-radius:14px;background:rgba(6,21,43,.96);border:1px solid #e5b943;color:#fff;font:600 13px/1.4 system-ui,sans-serif;text-align:center;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s;z-index:9}
#toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<main class="wrap">
 <img src="kart.webp" width="1024" height="1536" alt="Gültekin Öksüz - CFO, TheListing.io">
 <svg viewBox="0 0 1024 1536" role="group" aria-label="Kartvizit bağlantıları">
  <a href="Gultekin_Oksuz.vcf" aria-label="Kişilere Ekle" id="addBtn" type="text/vcard"><polygon points="195,792 872,885 862,978 190,882"/></a>
  <a href="tel:+905458416977" aria-label="Ara" ><polygon points="188,912 335,925 318,1075 165,1058"/></a>
  <a href="https://wa.me/905458416977" aria-label="WhatsApp" target="_blank" rel="noopener"><polygon points="355,938 512,950 495,1100 337,1085"/></a>
  <a href="https://t.me/tekinn" aria-label="Telegram" target="_blank" rel="noopener"><polygon points="530,962 688,980 668,1138 518,1120"/></a>
  <a href="https://www.linkedin.com/in/gultekinoksuz" aria-label="LinkedIn" target="_blank" rel="noopener"><polygon points="705,990 862,1005 843,1157 695,1135"/></a>
  <a href="mailto:info@thelisting.io" aria-label="E-posta gönder" ><polygon points="160,1080 487,1127 478,1215 145,1165"/></a>
  <a href="https://thelisting.io/" aria-label="Web sitesi" target="_blank" rel="noopener"><polygon points="500,1135 838,1185 830,1277 498,1220"/></a>
  <a href="#" aria-label="Kartviziti paylaş" id="shareBtn"><polygon points="140,1188 828,1298 815,1405 122,1270"/></a>
 </svg>
</main>
<div id="toast" role="status"></div>
<script>
/* Android: paylaşım menüsüyle Kişiler uygulamasını aç; olmazsa vcf indirilir ve yönerge gösterilir. iPhone'da vcf bağlantısı doğrudan Kişi Ekle açar */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),6000)}
document.getElementById('addBtn').addEventListener('click',async e=>{
 if(!/Android/i.test(navigator.userAgent))return;
 e.preventDefault();
 if(navigator.canShare){try{const r=await fetch('Gultekin_Oksuz.vcf'),b=await r.blob();
  for(const type of ['text/vcard','text/x-vcard','text/directory']){const f=new File([b],'Gultekin_Oksuz.vcf',{type});
   if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}}catch(err){if(err&&err.name==='AbortError')return}}
 location.href='Gultekin_Oksuz.vcf?'+Date.now();
 toast('Dosya indi: bildirimden "Aç" veya İndirilenler\'den dosyaya dokunup Kişiler\'e kaydedin');});
function shareCard(){if(navigator.share){navigator.share({title:'Gültekin Öksüz - TheListing.io',text:'Gültekin Öksüz | CFO - TheListing.io Dijital Kartvizit',url:location.href}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href).then(()=>alert('Sayfa bağlantısı panoya kopyalandı!'))}else{alert(location.href)}}
document.getElementById('shareBtn').addEventListener('click',e=>{e.preventDefault();shareCard()});
</script>
</body>
</html>
